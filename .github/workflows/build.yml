name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test --verbose
    - name: Check Crate Graph
      run: cargo install cargo-deny --locked && cargo deny check advisories sources bans
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Prerequisites
      run: sudo apt-get install build-essential debhelper-compat fakeroot
    - name: Build
      run: dpkg-buildpackage -b -us -uc
