[package]
name = "rsgit"
version = "1.1.0"
edition = "2021"
description = "rsgit: A hyper-hyperfast web frontend for git repositories written in Rust."

[features]
default = ["jemalloc"]
heap-analyse = ["dep:dhat"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
dhat = { version = "0.3", optional = true }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "process", "io-util", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
gix = { version = "0.85", default-features = false, features = ["sha1", "blob-diff"] }
maud = { version = "0.27", default-features = false }
similar = { version = "3.1.1", default-features = false, features = ["text"] }
tikv-jemallocator = { version = "0.7", optional = true }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
