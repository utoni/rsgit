[package]
name = "rsgit-web"
version = "1.3.2"
edition = "2024"
description = "rsgit: A hyper-hyperfast web frontend for git repositories written in Rust."
documentation-file = "README.md"
repository = "https://github.com/utoni/rsgit"
homepage = "https://git.impl.cc"
license-file = "COPYING"

[features]
default = ["jemalloc"]
heap-analyse = ["dep:dhat"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
smol = "2"
async-h1 = "2"
http-types = "2"
futures-lite = "2"
async-lock = "3"
async-signal = "0.2"
percent-encoding = "2"
dhat = { version = "0.3", optional = true }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
gix = { version = "0.85", default-features = false, features = ["sha1", "blob-diff"] }
maud = { version = "0.27", default-features = false }
similar = { version = "3.1.1", default-features = false, features = ["text"] }
tikv-jemallocator = { version = "0.7", optional = true }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-diff = "0.1"
tree-sitter-make = "1.1"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
rpath = false
incremental = false
